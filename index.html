<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 · 经典数字合并游戏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background:#faf8ef; color:#776e65; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 12px 40px; }
  .wrap { width:min(92vw, 460px); }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  h1 { font-size:56px; font-weight:800; line-height:1; color:#776e65; }
  .tagline { margin-top:6px; font-size:14px; }
  .scores { display:flex; gap:8px; }
  .score-box { background:#bbada0; border-radius:6px; padding:6px 14px; min-width:74px; text-align:center; color:#fff; }
  .score-box .label { font-size:11px; letter-spacing:1px; color:#eee4da; text-transform:uppercase; }
  .score-box .value { font-size:22px; font-weight:700; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:16px 0 12px; }
  .bar p { font-size:14px; }
  button { background:#8f7a66; color:#f9f6f2; border:none; border-radius:6px; padding:10px 16px; font-size:15px; font-weight:600; cursor:pointer; }
  button:active { background:#7c6a58; }
  #board { position:relative; background:#bbada0; border-radius:8px; padding:10px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; touch-action:none; user-select:none; }
  .cell { aspect-ratio:1; background:rgba(238,228,218,.35); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:clamp(22px, 8vw, 40px); color:#776e65; transition:background .08s; }
  .cell[data-v="2"]{background:#eee4da}.cell[data-v="4"]{background:#ede0c8}
  .cell[data-v="8"]{background:#f2b179;color:#f9f6f2}.cell[data-v="16"]{background:#f59563;color:#f9f6f2}
  .cell[data-v="32"]{background:#f67c5f;color:#f9f6f2}.cell[data-v="64"]{background:#f65e3b;color:#f9f6f2}
  .cell[data-v="128"]{background:#edcf72;color:#f9f6f2;font-size:clamp(18px,6.5vw,34px)}
  .cell[data-v="256"]{background:#edcc61;color:#f9f6f2;font-size:clamp(18px,6.5vw,34px)}
  .cell[data-v="512"]{background:#edc850;color:#f9f6f2;font-size:clamp(18px,6.5vw,34px)}
  .cell[data-v="1024"]{background:#edc53f;color:#f9f6f2;font-size:clamp(15px,5.5vw,28px)}
  .cell[data-v="2048"]{background:#edc22e;color:#f9f6f2;font-size:clamp(15px,5.5vw,28px);box-shadow:0 0 18px rgba(237,194,46,.65)}
  .cell[data-big="1"]{font-size:clamp(13px,4.8vw,24px)}
  #overlay { position:absolute; inset:0; background:rgba(238,228,218,.78); border-radius:8px; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:5; }
  #overlay.show { display:flex; }
  #overlay .msg { font-size:38px; font-weight:800; }
  footer { margin-top:16px; font-size:13px; line-height:1.7; color:#8f8578; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>2048</h1>
      <div class="tagline">合并相同数字，拼出 <b>2048</b>！</div>
    </div>
    <div class="scores">
      <div class="score-box"><div class="label">分数</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">最高</div><div class="value" id="best">0</div></div>
    </div>
  </header>
  <div class="bar">
    <p>方向键 / WASD / 手指滑动移动方块</p>
    <button id="newGame">新游戏</button>
  </div>
  <div id="board">
    <div id="overlay"><div class="msg" id="overlayMsg">游戏结束</div><button id="retry">再来一局</button></div>
  </div>
  <footer>
    玩法：每次移动，所有方块向同一方向滑动，相同数字相撞合并翻倍。棋盘填满且无法合并时游戏结束；拼出 2048 获胜，可继续挑战更高数字。
  </footer>
</div>
<script>
(function(){
  var SIZE=4, grid, score, best=+(localStorage.getItem('best2048')||0), won=false, over=false;
  var board=document.getElementById('board'), overlay=document.getElementById('overlay'),
      overlayMsg=document.getElementById('overlayMsg'), scoreEl=document.getElementById('score'),
      bestEl=document.getElementById('best');
  var cells=[];
  for(var i=0;i<SIZE*SIZE;i++){ var d=document.createElement('div'); d.className='cell'; board.insertBefore(d, overlay); cells.push(d); }

  function emptyIdx(){ var e=[]; for(var i=0;i<16;i++) if(!grid[i]) e.push(i); return e; }
  function addRandom(){ var e=emptyIdx(); if(!e.length) return; grid[e[Math.floor(Math.random()*e.length)]] = Math.random()<0.9?2:4; }
  function render(){
    for(var i=0;i<16;i++){ var v=grid[i]; cells[i].textContent=v||''; if(v) cells[i].dataset.v=v; else cells[i].removeAttribute('data-v'); cells[i].dataset.big = (v>=4096)?'1':''; }
    scoreEl.textContent=score; bestEl.textContent=best;
  }
  function showOverlay(msg){ overlayMsg.textContent=msg; overlay.classList.add('show'); }
  function hideOverlay(){ overlay.classList.remove('show'); }
  function start(){ grid=new Array(16).fill(0); score=0; won=false; over=false; addRandom(); addRandom(); hideOverlay(); render(); }
  function slide(row){
    var arr=row.filter(function(x){return x;}), gained=0;
    for(var i=0;i<arr.length-1;i++){ if(arr[i]===arr[i+1]){ arr[i]*=2; gained+=arr[i]; if(arr[i]===2048) won=true; arr.splice(i+1,1); } }
    while(arr.length<4) arr.push(0);
    return {row:arr, gained:gained};
  }
  function move(dir){ // 0左 1上 2右 3下
    if(over) return;
    var before=grid.slice(), gainedTotal=0;
    for(var k=0;k<4;k++){
      var line=[];
      for(var j=0;j<4;j++){
        var idx = dir===0 ? k*4+j : dir===2 ? k*4+(3-j) : dir===1 ? j*4+k : (3-j)*4+k;
        line.push(grid[idx]);
      }
      var r=slide(line); gainedTotal+=r.gained;
      for(var m=0;m<4;m++){
        var idx2 = dir===0 ? k*4+m : dir===2 ? k*4+(3-m) : dir===1 ? m*4+k : (3-m)*4+k;
        grid[idx2]=r.row[m];
      }
    }
    if(before.join(',')===grid.join(',')) return;
    score+=gainedTotal; if(score>best){ best=score; localStorage.setItem('best2048',best); }
    addRandom(); render();
    if(won && !over){ over=true; showOverlay('你赢了！拼出 2048'); return; }
    if(!canMove()){ over=true; showOverlay('游戏结束'); }
  }
  function canMove(){
    if(emptyIdx().length) return true;
    for(var r=0;r<4;r++) for(var c=0;c<4;c++){
      var v=grid[r*4+c];
      if(c<3 && grid[r*4+c+1]===v) return true;
      if(r<3 && grid[(r+1)*4+c]===v) return true;
    }
    return false;
  }
  document.addEventListener('keydown', function(e){
    var map={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3,A:0,W:1,D:2,S:3};
    if(e.key in map){ e.preventDefault(); move(map[e.key]); }
  });
  var tx=0, ty=0;
  board.addEventListener('touchstart', function(e){ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
  board.addEventListener('touchend', function(e){
    var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
    move(Math.abs(dx)>Math.abs(dy) ? (dx>0?2:0) : (dy>0?3:1));
  });
  document.getElementById('newGame').addEventListener('click', start);
  document.getElementById('retry').addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
